<html lang="de">

{% include head.html %}

<body class="is-page">
    <script type="text/javascript">document.body.classList.add("is-loading");</script>

    {% include header.html %}

    <section id="banner" class="major page-hero"{% if page.image %} style="--hero-image: url('{{ page.image | relative_url }}');"{% endif %} aria-label="{{ page.title }}">
        <div class="inner">
            <header class="major">
                <h1>{{ page.title }}</h1>
            </header>
            {% if page.description %}
            <div class="content">
                <p class="hero-support">{{ page.description }}</p>
            </div>
            {% endif %}
        </div>
    </section>

    <div id="main" class="alt">
        <section class="page-content">
            <div class="inner">
                {{ content }}
            </div>
        </section>
    </div>

    {% include footer.html %}

</body>

</html>
