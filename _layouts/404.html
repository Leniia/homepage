<!DOCTYPE html>
<html lang="de">

{% include head.html %}

<body class="is-page is-404">
    {% include header.html %}

    <section id="banner" class="major page-hero" style="--hero-image: url('{{ 'assets/images/banner.jpg' | relative_url }}');" aria-label="Seite nicht gefunden">
        <div class="inner">
            <header class="major">
                <h1>404</h1>
            </header>
            <div class="content">
                <p class="hero-support">Diese Seite gibt es leider nicht.</p>
            </div>
        </div>
    </section>

    <div id="main" class="alt">
        <section class="page-content">
            <div class="inner">
                <h2>Verlaufen?</h2>
                <p>Kein Problem — manchmal verirrt man sich. Zurück zur Startseite geht es mit einem Klick.</p>
                <ul class="actions">
                    <li><a href="{{ '' | relative_url }}/" class="button special">Zur Startseite</a></li>
                    <li><a href="{{ '' | relative_url }}/#anfragen" class="button">Anfragen</a></li>
                </ul>
            </div>
        </section>
    </div>

    {% include footer.html %}

</body>

</html>
